    <script>
      // Ensure window.fetch is writable with both getter and setter
      // Prevents "Cannot set property fetch of #<Window> which has only a getter" when external wrappers/sandboxes reassign fetch
      (function() {
        try {
          if (typeof window !== 'undefined') {
            var origFetch = window.fetch ? window.fetch.bind(window) : null;
            var currentFetch = origFetch;
            Object.defineProperty(window, 'fetch', {
              get: function() {
                return currentFetch;
              },
              set: function(val) {
                currentFetch = typeof val === 'function' ? val : origFetch;
              },
              configurable: true,
              enumerable: true
            });
          }
        } catch (e) {
          // Gracefully fallback
        }
      })();
    </script>
